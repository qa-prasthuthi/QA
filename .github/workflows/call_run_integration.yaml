name: z(Internal) Run integration

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true

jobs:
  integration:
    name: integration-${{ inputs.environment }}
    runs-on: [ self-hosted, "aws:instancetype:c6i.xlarge", "aws:ami:actions-runner-ubuntu" ]
    environment: ${{ inputs.environment }}

    env:
      ENV: ${{ inputs.environment }}

    steps:
      # Checkout your automation test repo
      - name: Checkout test repository
        uses: actions/checkout@v4

      # Clone the CLI repo into cloudprograms-cli folder
      - name: Checkout CloudPrograms CLI
        uses: actions/checkout@v4
        with:
          repository: https://github.com/2kg-coretech-partners/cloudprograms-cli.git
          path: cloudprograms-cli

      # Setup Go (required for building CLI)
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'

      # Build CLI
      - name: Build CLI
        working-directory: cloudprograms-cli
        run: make build

      # Install CLI
      - name: Install CLI
        working-directory: cloudprograms-cli
        run: make install

      # Verify CLI installation
      - name: Verify CLI
        run: |
          which cloudprograms || true
          cloudprograms --version || true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.20.0

      - name: Install dependencies
        run: npm ci

      - name: Run npm test integration
        run: npm run test:integration:${{ inputs.environment }}

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ inputs.environment }}
          path: ./test-results*