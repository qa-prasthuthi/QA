name: Run integration on workflow calls
on:
  repository_dispatch:
    types: [run_integration]
jobs:
  validate-input:
    runs-on: ubuntu-latest
    steps:
      - name: Validate environment input
        run: |
          if [ -z "${{ github.event.client_payload.environment }}" ]; then
            echo "::error ::Missing 'environment' in repository_dispatch payload"
            exit 1
          fi
  callable-integration:
    needs: [ validate-input ]
    uses: ./.github/workflows/call_run_integration.yaml
    with:
      environment: ${{ github.event.client_payload.environment }}
    secrets: inherit
